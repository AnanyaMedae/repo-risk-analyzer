# Optional phase. Create the secret first:
#   kubectl create secret generic github --from-literal=token=YOUR_TOKEN
apiVersion: apps/v1
kind: Deployment
metadata: {name: repo-risk-analyzer}
spec:
  replicas: 1
  selector: {matchLabels: {app: repo-risk-analyzer}}
  template:
    metadata: {labels: {app: repo-risk-analyzer}}
    spec:
      containers:
        - name: app
          image: repo-risk-analyzer:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          env:
            - name: GITHUB_TOKEN
              valueFrom: {secretKeyRef: {name: github, key: token, optional: true}}
          readinessProbe: {httpGet: {path: /healthz, port: 5000}}
---
apiVersion: v1
kind: Service
metadata: {name: repo-risk-analyzer}
spec:
  selector: {app: repo-risk-analyzer}
  ports: [{port: 80, targetPort: 5000}]
